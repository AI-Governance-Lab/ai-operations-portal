[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-operations-portal-core"
version = "1.0.0"
description = "Self-Hosted Open-Core AI Governance, FinOps, AIOps & Cryptographic Audit Middleware"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn[standard]>=0.29.0,<1.0.0",
    "pydantic>=2.6.0,<3.0.0",
    "prometheus-client>=0.20.0,<1.0.0",
    "psutil>=5.9.8,<8.0.0",
    "litellm>=1.35.0,<2.0.0",
    "pyyaml>=6.0.1,<7.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "httpx>=0.27.0,<1.0.0",
]

[tool.setuptools]
packages = ["src"]
