[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-operations-portal-core"
version = "1.0.0"
description = "Self-Hosted Open-Core AI Governance, FinOps, AIOps & Cryptographic Audit Middleware"
requires-python = ">=3.9"
license = { text = "All Rights Reserved - Portfolio & Evaluation Only" }
dependencies = [
    "fastapi>=0.128.8,<1.0.0",
    "uvicorn[standard]>=0.39.0,<1.0.0",
    "pydantic>=2.12.5,<3.0.0",
    "prometheus-client>=0.26.0,<1.0.0",
    "psutil>=7.2.2,<8.0.0",
    "litellm>=1.109.1,<2.0.0",
    "pyyaml>=6.0.3,<7.0.0",
    "python-dotenv>=1.2.4,<2.0.0",
    "httpx>=0.28.1,<1.0.0",
]

[tool.setuptools]
packages = ["src"]
